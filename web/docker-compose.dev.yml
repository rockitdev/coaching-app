services:
  # Express API + video serving (internal only)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - hockey_data:/app/data
    environment:
      - PORT=4321
      - DATA_DIR=/app/data
    restart: unless-stopped

  # React + Vite PWA dev server (exposed on host port 4328)
  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      # Bind loopback + LAN explicitly -- NOT 0.0.0.0 (see CLAUDE.md gotchas)
      - "127.0.0.1:4328:5173"
      - "192.168.1.38:4328:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  node_modules:
  client_node_modules:
  hockey_data:
